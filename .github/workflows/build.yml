name: Build Velocity Desktop
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: velocity-app

jobs:
  check:
    name: Frontend typecheck
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    name: Build installer
    runs-on: windows-latest
    needs: [check]
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Create swap space
        run: |
          echo "Creating swap file..."
          $swappath = "$env:USERPROFILE\swap.sys"
          fsutil file createnew $swappath 4GB
          Write-Host "Swap file created, enabling..."
          # Use PowerShell to create a pagefile
          $computer = Get-WmiObject Win32_ComputerSystem
          $computer.AutomaticManagedPagefile = $false
          $computer.Put() | Out-Null
          $pagefile = Get-WmiObject Win32_PageFileSetting
          if ($pagefile) {
            $pagefile.Delete() | Out-Null
          }
          $newPagefile = Set-WmiInstance -Class Win32_PageFileSetting -Arguments @{ Name = $swappath; InitialSize = 4096; MaximumSize = 4096 }
          Write-Host "Swap added: 4GB"

      - name: Build Tauri app
        run: npx tauri build --bundles msi
        env:
          CARGO_BUILD_JOBS: 2
          RUSTFLAGS: -C codegen-units=1 -C debuginfo=0

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: velocity-windows-installer
          path: ${{ env.APP_DIR }}/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: velocity-windows-installer
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.msi
          generate_release_notes: true
