name: Build Velocity Desktop
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: velocity-app

jobs:
  check:
    name: Frontend typecheck
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    name: Build installer
    runs-on: windows-latest
    needs: [check]
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (signed for release tags)
        run: npx tauri build --bundles msi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: velocity-windows-installer
          path: |
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/msi/*.msi
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/msi/*.msi.sig
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/msi/*.msi.zip
          if-no-files-found: warn

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: velocity-windows-installer

      - name: Generate update.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $msi = Get-ChildItem -Filter "*.msi" | Select-Object -First 1
          $sig = Get-ChildItem -Filter "*.msi.sig" | Select-Object -First 1
          $sigContent = Get-Content $sig.FullName -Raw
          $msiName = $msi.Name
          $updateJson = @{
            version = $version
            notes = "See the release notes for details."
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigContent.Trim()
                url = "https://github.com/tq1r/velocity/releases/download/$tag/$msiName"
              }
            }
          }
          $updateJson | ConvertTo-Json | Set-Content "latest.json"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.msi
            *.msi.sig
            latest.json
          generate_release_notes: true
