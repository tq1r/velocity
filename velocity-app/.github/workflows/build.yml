name: Build Velocity Desktop
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (MSI installer)
        run: npx tauri build --bundles msi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: velocity-windows-installer
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload portable (optional)
        uses: actions/upload-artifact@v4
        with:
          name: velocity-portable
          path: src-tauri/target/release/bundle/nsis/*.exe
